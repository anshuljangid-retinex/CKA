<script>
const DATA = {"n_samples": 21, "checkpoint": null, "status": "waiting_for_checkpoint", "note": "Images + GT ready. Local/Global predictions fill after TokenProjector train + compare_local_global.py", "branches": ["local", "global", "full"], "metrics": {"local": {"cer": null, "wer": null, "exact_match": null}, "global": {"cer": null, "wer": null, "exact_match": null}, "full": {"cer": null, "wer": null, "exact_match": null}}, "samples": [{"name": "rev_bne_es_3dc52083dce4beb2_p01.aug00.jpg", "reference": "\u003cdiv data-bbox=\"271 173 319 211\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003eREVISTA DE TEATROS.\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"162 238 595 260\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003eDIARIO PINTORESCO DE LITERATURA.\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"89 282 131 288\" data-label=\"Text\"\u003e\n\u003cp\u003eNÚM. 202.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"374 276 518 283\" data-label=\"Text\"\u003e\n\u003cp\u003eMADRID 3 DE ABRIL DE 1845.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"778 271 846 278\" data-label=\"Text\"\u003e\n\u003cp\u003e\u003cb\u003eSegunda serie.\u003c/b\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"189 311 233 317\" data-label=\"Text\"\u003e\n\u003cp\u003e\u003cb\u003eRIENZI.\u003c/b\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"109 341 311 355\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003eEL ÚLTIMO TRIBUNO.\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"80 385 494 412\" data-label=\"Text\"\u003e\n\u003cp\u003eEl italiano se reunió á la partida, y la condujo poco despues á la Gran Compañía: un destacamento de treinta hombres la acompañó hasta el campamento, y un capitán se encargó de dirigir los pasos del jefe italiano.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"83 442 501 501\" data-label=\"Text\"\u003e\n\u003cp\u003eAcostumbrado á la severa disciplina de las tropas francesas, inglesas y alemanas, creyó que jamás habían presenciado sus ojos tanto desorden. Por todas partes aparecían soldados medio desnudos conduciendo el ganado que acababan de robar: pululaban entre ellos impúdicas mujeres que bailaban deshonestamente ébrias de aguardiente ó incitaban á los guerreros á seguir las á los vecinos bosques: otros soldados medio borrachos bebían y blasfemaban. Por dó quiera se oían juramentos, cauciones lúbricas, disputas que concluían á estocadas, á ejemplo de los espadachines de la Calabria ó de los Apenninos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"89 504 507 551\" data-label=\"Text\"\u003e\n\u003cp\u003eA pesar de la custodia de los treinta guerreros, no pudieron atravesar los prisioneros por medio de aquellas hordas de salvajes sin ser molestados repetidas veces. Centenares de muchachos hambrientos, haraposos, pálidos y flacos, corrían delante de los caballeros lanzando furiosos gritos, y exigiendo imperiosamente una limosna por el amor de Dios, al paso que sentadas en las orgías del campo hacían gala de su torpe liviandad no pocas jóvenes gastadas por el vicio antes de haber salido de la adolescencia.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"98 569 516 628\" data-label=\"Text\"\u003e\n\u003cp\u003eAlgunos minutos despues entraron en un barrio ó cuartel del campamento, animados en verdad, pero enteramente distinto. Veíanse formados en línea sin número de guerreros por ambos extremos de la senda que conducía á una llanura espaciosa rodeada de palizadas, y en cuyo centro ondeaba una bandera azul. Iban y venían diversos soldados de un lado al otro, pero con el mayor orden y compostura auncuando una cuespresión de alegría animaba sus semblantes tostados muchos de ellos iban cargados de fardos que depositaban en el llano, y de tiempo en tiempo abrían las manos y contaban y recontaban las piezas de oro que tenían.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"96 636 517 663\" data-label=\"Text\"\u003e\n\u003cp\u003e—Este es el barrio de los mercaderes, dijo el capitán: se les admite con toda seguridad en el campamento, y sus personas y propiedades son rigorosamente respetadas, compran á los soldados el botín que les ha cabido en suerte, lo pagan bien, y todos están contentos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"87 668 514 713\" data-label=\"Text\"\u003e\n\u003cp\u003e—¡Diávoló! ¡Groseral!.... No hay en Italia una ciudad que posea leyes más imparciales. Ahí teneis las tiendas de los jueces nombrados para dirimir todas las disputas que ocurren en la Gran Compañía con respecto al tráfico; aquella otra grande, á mano derecha, contiene el tesoro del ejército, porque habéis de saber que Fra Moreale siempre dá puntualmente la paga al soldado. Interiormente todo está aquí tan arreglado como una máquina bien montada, aunque algunas veces, lo confieso, esta máquina ocasiona desórdenes exteriores.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"77 720 510 776\" data-label=\"Text\"\u003e\n\u003cp\u003eCon tales medios había podido reunir el caballero de san Juan numerosos, bien equipados y obedientes tropas; todos los días le llegaban nuevos soldados; solo se hablaba entre los mercenarios del país de las grandes riquezas adquiridas bajo de su bandera, y todos los aventureros que estaban á sueldo de las repúblicas italianas ó de los tiranos que asolaban el territorio, suspiraban por hallarse en las filas independientes de Fra Moreale. Noticias tal vez exageradas de aquella opulencia habían atravesado los Alpes, y nuestro cautivo jefe vió mas de una tienda adornada con las orgullosas banderas, y con los blasones de la nobleza alemana y de la caballería francesa.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"66 809 507 845\" data-label=\"Text\"\u003e\n\u003cp\u003eTodo respiraba tranquilidad en el nuevo cuartel á que acababan de llegar; solo se escuchaba el ruido infernal del Pandemonium de la retaguardia como un murmullo confuso y despacible; algunos soldados cruzaban el camino dirigiéndose á las tiendas, pero apenas fijaban su atención en los prisioneros ni en sus conductores.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"493 307 918 334\" data-label=\"Text\"\u003e\n\u003cp\u003eDicha tienda, colgada de púrpura recamada de oro, estaba algo separada de las demas: en sus inmediaciones serpenteaba un tranquilo arroyuelo, y un árbol corpulento hacia sombra al magnífico pabellón.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"656 362 734 369\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003eCAPITULO II.\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"532 382 779 391\" data-label=\"Text\"\u003e\n\u003cp\u003eAdriano, huésped de Montreal, por segunda vez.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"500 406 930 544\" data-label=\"Text\"\u003e\n\u003cp\u003eM ONTREAL ocupaba el sitio de preferencia sentado delante de una mesa rodeada de hombres, entre los cuales había empleados militares y civiles, á quienes llamaba sus consejeros, y con los cuales deliberaba, en apariencia, acerca de sus proyectos futuros. Estos hombres, sacados de distintas ciudades, estaban profundamente versados en los negocios interiores de los diversos estados á que pertenecían, y podían calcular con exactitud las fuerzas guerreras de un señor, los florines de un mercader y la voluntad de un pueblo. De este modo el caballero provenzal se mostraba en su campamento tan hombre de estado como general. Las noticias que por aquel medio adquiría eran ademas sumamente preciosas para el jefe de la Grande Compañía, pues le daban á conocer el tiempo preciso en que le convenía atacar á un enemigo, y la suma que debía exigir para hacer cesar las hostilidades: sabía á punto fijo con qué clase de personas contar, y si podía importunar ó mostrarse fácil y generoso. Sucedia muchas veces que, por medio de alguna secreta intriga, la aparición del estandarte de Montreal delante de los muros de una ciudad era la señal de una sedición interior; y tal vez estas maniobras se dirigían á resultados lejanos, al mismo tiempo que favorecían sus miras presentes.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"510 558 910 576\" data-label=\"Text\"\u003e\n\u003cp\u003e—Conducidle aquí sin perder tiempo, dijo al oficial. Señores, continuó dirigiéndose á sus consejeros y frotando las manos de contento; me parece que el pájaro está ya en nuestra jaula: pronto lo veremos.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"514 600 936 618\" data-label=\"Text\"\u003e\n\u003cp\u003e—Gualtero de Montreal, dijo el prisionero, aquí me teneis; soy vuestro huésped por segunda vez: tal vez os costará trabajo reconocer bajo estas tostadas facciones á Adriano de Castello.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"515 621 936 667\" data-label=\"Text\"\u003e\n\u003cp\u003e—Perdonad, noble y valiente caballero, contestó Montreal levantándose con la mayor política: la equivocacion de mi gente ha desconcertado por un momento mi memoria; tengo, pues, el mayor gusto en estrechar contra la mia una mano que ha alcanzado tantos laureles desde nuestra última entrevista. La fama de vuestras proezas ha resonado agradablemente en mis oídos. ¡Holá! gritó á los escuderos que rodeaban la estancia; cuidad á este noble señor y á los que á sus órdenes han llegado: señor Adriano, soy con vos al instante.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"513 672 931 692\" data-label=\"Text\"\u003e\n\u003cp\u003eAdriano salió, y Montreal, olvidando la presencia de sus consejeros, atravesó á largos pasos la tienda, hizo llamar al oficial que había conducido al caballero romano, y le dijo:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"507 733 934 767\" data-label=\"Text\"\u003e\n\u003cp\u003e—Caballero, dijo Montreal, es cierto que mis avanzadas han recibido orden de arrestar á toda persona armada que encontrasen en el camino de Florencia. Estoy en guerra con esa ciudad, pero lo que es hoy esperaba tener aquí otro prisionero. ¿Creeis que haya necesidad de deciros que tanto vos como vuestros soldados sois libres?\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"504 805 935 843\" data-label=\"Text\"\u003e\n\u003cp\u003e—Os han dicho la verdad: fué mi enemigo y le he vencido; por consiguiente me ha rendido pías: marché sobre Siena por Asciano, y por la miseria de diez y seis mil florines perdoné á aquella ciudad: al presente me preparé á caer como el rayo sobre Florencia, que se ha atrevido á socorrer á Rimini: mis marchas son rápidas y forzadas, y no tardaré en levantar el campo.\u003c/p\u003e\n\u003c/div\u003e", "image_rel": "images/rev_bne_es_3dc52083dce4beb2_p01.aug00.jpg", "local": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "global": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "full": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}}, {"name": "rev_midv2020_3eebef0e93eb66f2_p01.aug00.jpg", "reference": "\u003cdiv data-bbox=\"206 125 906 396\" data-label=\"Image\"\u003e\n\u003cimg alt=\"The diagram illustrates a geometric graph structure composed of interconnected nodes linked by colored edges, forming a complex network that visually represents relationships within a mathematical framework related to symmetry versus regularity. The accompanying text identifies the topic as “Symmetry vs Regularity” and references “Spectra of Graphs Theory,” indicating the figure serves to demonstrate concepts in spectral graph theory through visual representation of graph connectivity and structural properties.\"/\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"176 415 789 660\" data-label=\"Image\"\u003e\n\u003cimg alt=\"The German identity card displays a photograph of a woman with blonde hair and blue eyes, alongside pri u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"476 784 524 793\" data-label=\"Page-Footer\"\u003e\n\u003cp\u003ePage 1 of 3\u003c/p\u003e\n\u003c/div\u003e", "image_rel": "images/syn_bank_statement_fa_000001_p01.aug00.jpg", "local": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "global": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "full": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}}, {"name": "syn_book_spread_ta_000014_p01.aug00.jpg", "reference": "\u003cdiv data-bbox=\"234 187 279 204\" data-label=\"Page-Header\"\u003e\n\u003cp\u003eமகிழ்கோ\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"249 214 263 225\" data-label=\"Page-Header\"\u003e\n\u003cp\u003e327\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"83 231 444 438\" data-label=\"Text\"\u003e\n\u003cp\u003eஇசைக்கருவிகள் பொதுவாக மூன்று பிரிவுகளாகப் பிரிக்கப்படலாம். பெரும்பாலும் உலோகத்தால் செய்யப்பட்ட நரம்புகளைத் தட்டி இசை உருவாக்குகின்ற அடிப்படையிலமைந்த கருவிகள், நரம்பு வாத்தியங்கள் என்று அழைக்கப்படுகின்றன. துளைகளினூடாக அல்லது அதிர்வு மூலம் ஒலியுண்டாக்கும் ஒரு பொருள்மீது காற்றுச் செலுத்துவதன் மூலம் இசை உருவாவதை அடிப்படையாகக் கொண்ட வாத்தியங்கள் காற்று வாத்தியங்கள் எனப்படுகின்றன. தாள லயத்தை உருவாக்கும் கருவிகள் தாள வாத்தியங்கள் ஆகும். அருனிமா போரா சந்தை வண்டிகளைப் பார்த்து மேடையில் தங்கி இருந்தாள். \u003csup\u003e1\u003c/sup\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"79 438 443 630\" data-label=\"Text\"\u003e\n\u003cp\u003eமூல மொழியில் வரலாற்றுரீதியாக, வந்துசெல்லும் உள்ளார்ந்த வேறுபாடுகளை கொண்டு மட்டுமே ஒரு மொழியினைத் தனித்த, சுதந்திர மொழியாகக் கொள்ளல் ஆகாது. எனினும், இவ்விதமான மாற்றங்கள் அந்த மொழியின் தோற்றத்திலும், இலக்கணத்திலும் ஏற்படுத்தும் நிரந்தர மாற்றங்களே மூல மொழியிலிருந்து அதை ஒரு சுதந்திரமான தனித்த மொழியாக உருமாற்றி அடையாளப்படுத்துகிறது. மலையாள வையாகரணனும் கேரளபாணினி என்றழைக்கப்படும் ஏ. ஆர். ரவி வர்ம்மாவின் கருத்துப்படி தமிழ் மொழியில் இருந்து மலையாளம் இவ்விதமாக வேறுபடுகிறது. அவையாவன: \u003csup\u003e2\u003c/sup\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"74 623 440 839\" data-label=\"Text\"\u003e\n\u003cp\u003eஒரு கோணம் செங்கோணமாக (90 பாகை அல்லது π/2 ரேடியன் அளவு) அமைந்துள்ள முக்கோணங்கள், செங்கோண முக்கோணங்கள் எனப்படுகின்றன. செங்கோணத்துக்கு எதிராக உள்ள பக்கம் செம்பக்கம் என அழைக்கப்படும். இதுவே செங்கோண முக்கோணமொன்றின் மிக நீளமான பக்கமாகும். முக்கோணத்திலுள்ள யாதேனும் ஒரு கோணம் செங்கோணத்திலும் பெரிதாக இருந்தால் அது விரிகோண முக்கோணம் எனப்படும். எல்லாக் கோணங்களும் செங்கோணத்திலும் சிறிதாக இருப்பின் அத்தகைய முக்கோணம் ஒரு கூர்ங்கோண முக்கோணம் ஆகும். இளம் பணியாளர் கடைசி ரயில் வரை துறைமுக சுவரில் காத்திருந்தார்.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"549 194 913 332\" data-label=\"Footnote\"\u003e\n\u003cp\u003e1. பயன்பாட்டு மொழியியல், வரலாற்று மொழியியல், எழுத்திலக்கணம்\n(orthography), எழுத்து முறைமைகள், ஒப்பீட்டு மொழியியல், சமூகமொழியியல்,\nமொழியியல்சார் மானிடவியல், திறனாய்வுப் பேச்சுக்கூறுபாடு, உளவியல்சார்\nமொழியியல், மொழி கற்றல், படிமலர்ச்சி மொழியியல், மானிடவியல்சார்\nமொழியியல், அறிதிற அறிவியல், நரம்பியல்சார் மொழியியல், மற்றும் கணனி\nஅறிவியல் என்பவற்றிலும் இயல்பு மொழி விளக்கம், பேச்சு\nஅடையாளங்காணல் (speech recognition), பேசுனர் அடையாளங்காணல் (speaker\nrecognition) (authentication), பேச்சுத் தொகுப்பு (speech synthesis), மற்றும் மேலும்\nபொதுவாக,\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"549 336 912 399\" data-label=\"Footnote\"\u003e\n\u003cp\u003e2. அழியாத சோழர் பெருங்கோயில்கள் என்ற பெயரில் இக்கோயில்,\nகங்கைகொண்ட சோழீசுவரர் கோயில், தாராசுரம் ஐராவதேசுவரர் கோயில்\nஆகிய மூன்றும் இயுனெசுகோ நிறுவனத்தால் பொது ஊழி உலகப்பாரம்பரியக்\nகளப் பட்டியலில் இடம்பெற்றுள்ளன.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"549 399 918 536\" data-label=\"Text\"\u003e\n\u003cp\u003eபொறியியல் அகல்விரிவான புலம் என்பதால் அதைப் பல உட்புலங்களாகப் பிரிக்கலாம். ஒரு பொறியாளர் ஒரு குறிப்பிட்ட புலத்தில் பயிற்சி பெற்றாலும் அவர் பட்டறிவு வாயிலாக பலபுல வல்லுனர் ஆகலாம். பொறியியல் வழக்கமாக நான்கு பெரும்பிரிவுகளாகப் பிரிக்கப்படுகிறது: அவை வேதிப் பொறியியல், குடிசார் பொறியியல், மின்பொறியியல், இயந்திரப் பொறியியல் என்பனவாகும்.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"549 531 911 707\" data-label=\"Text\"\u003e\n\u003cp\u003eதாஜ்மகால் பற்றி சுவாமி விவேகானந்தரின் கருத்து சுவாமி விவேகானந்தர் தாஜ்மகாலைப் பார்த்த போது கூறிய கருத்து: இங்குள்ள சலவைக் கல்துண்டு ஒன்றைப் பிழிய முடியுமானால் அதிலிருந்துகூட அந்த அரசனின் காதலும் சோகமும் சொட்டும். இதன் உள்ளே உள்ள அழகு வேலைப்பாட்டைக் கற்க வேண்டுமானால், ஒவ்வொரு சதுர அங்குலத்திற்கும் ஆறுமாதமாவது தேவைப்படும். எட்டி ஜாக்சன் காதல் மறக்க முடியவில்லை என்றாலும், மீனவர்கள் புழுக்களில் சிதறடிக்கப்பட்டனர்.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"549 698 924 860\" data-label=\"Text\"\u003e\n\u003cp\u003eவில்லை என வழங்கும் இதன் உச்சிப் பன்முகக் கும்மட்டம் பல்டிக் தொடர்பகத்தின் கூம்புக் கண்ணாடிக் கும்மட்டத்தை நினைவுகூர்வதாக அமைந்துள்ளது. முன்பு இந்தக் கூம்புக் கண்ணாடிக் கும்மட்டம் பால்டிக் தொடர்கத்தின் தரைப்பகுதியில் இருந்தது. அதன் பெரும்பகுதி இப்போது தேசிய கடல்சார் அருங்காட்சியகத்தில்காட்சிக்கு வைக்கப்பட்டுள்ளது. பள்ளி ஆசிரியர் ரெபேக்கா கோஸ்டாவுக்கு நீண்டகால நோய் பற்றி கூறினார்.\u003c/p\u003e\n\u003c/div\u003e", "image_rel": "images/syn_book_spread_ta_000014_p01.aug00.jpg", "local": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "global": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "full": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}}, {"name": "syn_handwritten_letter_000025_p01.aug00.jpg", "reference": "\u003cdiv data-bbox=\"685 102 880 122\" data-label=\"Text\"\u003e\n\u003cp\u003e5th December 2026\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"118 146 233 173\" data-label=\"Text\"\u003e\n\u003cp\u003eDear Bryan,\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"119 172 871 278\" data-label=\"Text\"\u003e\n\u003cp\u003eAll that summer, the sailor walked along the footbridge. In the silence, Stanley Ali returned to the post office. The shopkeeper waited by the gate until the last train. The harbour wall overlooked the river. The scent of woodsmoke drifted from the churchyard. The tide scattered across the river.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"121 291 857 366\" data-label=\"Text\"\u003e\n\u003cp\u003eThe old woman told Mrs Nicola Bird about the farewell. All that summer, Grace Smith-Adams wrote of isolation and doubt. Caleb Gaba lingered \u003cdel\u003eat\u003c/del\u003e the gate, watching the lamplighters. The distant ships scattered across the hills. Kevin Brown watched the children from the balcony.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"124 380 876 483\" data-label=\"Text\"\u003e\n\u003cp\u003eThere was affection in Yash's voice. Nathan Brewer found the creased signet ring. That winter, Kelli Moore mended the muffler, but at last, the sea lay still beneath the grey sky. Widisha remembered the tavern as it had once been. Kala Sani and Jay parted at the porch.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"231 485 310 509\" data-label=\"Text\"\u003e\n\u003cp\u003e^ By midday\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"120 523 864 627\" data-label=\"Text\"\u003e\n\u003cp\u003eTracey Khan-Faulkner felt a quiet \u003cdel\u003eforeboding.\u003c/del\u003e Candice Harper could not forget the reunion. A quiet calm settled over the tavern. Diana Burke watched Alexis cross the high street. \u003cdel\u003eCarlos\u003c/del\u003e spoke of mystery and consolation. For years Toby Cox had kept the half-hidden brooch. By first light, the bells had fallen silent.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"123 641 881 750\" data-label=\"Text\"\u003e\n\u003cp\u003eOne grey morning, the shopkeeper strolled along the garden path. The tender summer came back to Christopher Dominguez at the balcony as the harbour wall overlooked the hills. Brittany spoke of solitude and truth. Children's laughter echoed across the harbor. By midday, the rain had stopped.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"188 787 292 806\" data-label=\"Text\"\u003e\n\u003cp\u003eBest wishes,\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"202 820 392 843\" data-label=\"Text\"\u003e\n\u003cp\u003ePatrick Gallagher\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"112 858 845 901\" data-label=\"Text\"\u003e\n\u003cp\u003eP.S. As Lucky Gola could not forget the summer, Michael Nunez MD wrote to Janet about the unexpected visit.\u003c/p\u003e\n\u003c/div\u003e", "image_rel": "images/syn_handwritten_letter_000025_p01.aug00.jpg", "local": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "global": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "full": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}}, {"name": "syn_illustrated_report_si_000005_p01.aug00.jpg", "reference": "\u003cdiv data-bbox=\"66 166 666 204\" data-label=\"Section-Header\"\u003e\n\u003ch1\u003eනාගරීකරණය හා ජල සම්පත් කළමනාකරණය\u003c/h1\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"70 208 312 231\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003eසාහිත්‍ය සමාලෝචනය\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"73 224 873 331\" data-label=\"Text\"\u003e\n\u003cp\u003e1930 සිට වාණිජමය වශයෙන් මිළට ගත හැකි වූ රූපවාහිනී නිවාස හා ආයතනවල විශේෂයෙන් විනෝදාස්වාද හා ප්‍රවෘත්ති ප්‍රභවයක් ලෙස බහුලව භාවිතා වන ගෘහස්ථ සන්නිවේදන උපකරණයක් බවට පත්විය. 1970 VCR පටි මත වීඩියෝ පටිගත කිරීමේ සිට DVD වැනි සංඛ්‍යාංක ධාවන පද්ධති රූපවාහිනී මඟින් පටිගත කළ චිත්‍රපටි හා අනෙකුත් වැඩසටහන් නැරඹීමට ඉඩ ප්‍රස්ථාව ලබා දී ඇත. නියැදිය තෝරාගනු ලැබුවේ අහඹු නියැදි ක්‍රමය ඔස්සේය.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"84 329 919 427\" data-label=\"Text\"\u003e\n\u003cp\u003eමාතුල දනව්ව පිහිටියේ අද කෑගල්ල අවට පෙදෙසයි. පසුකාලිනයන් විසින් ‘මාතුල අළුලෙන’ ස්ථානය මාතලේ අලුවිහාරේ යෑයි උපකල්පනය කර හඳුන්වා ඇති බව පෙනේ. මහතිල හෙවත් ලොකු තල (මහ තල) ධාන්‍ය වර්ගයේ ශාක තිබූ පෙදෙස මහතල හෙවත් මාතලේ විය. එසේ නොමැතිව මාතුල මාතලේ වූවා නොවේ. මෙම න්‍යාය තවදුරටත් තහවුරු කිරීම සඳහා අමතර පර්යේෂණ අවශ්‍ය වේ. මෙම අධ්‍යයනයේ අරමුණ වන්නේ එම සාධකවල බලපෑම විමර්ශනය කිරීමයි.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"95 434 639 573\" data-label=\"Figure\"\u003e\n\u003cimg alt=\"The graph presents two plots showing performance characteristics of a centrifugal compressor rotor under different beta angles, illustrating how efficiency and pressure ratio vary with relative flow rate across three specified beta conditions. The left plot displays efficiency percentages against relative flow rate for beta angles of 40°, 45°, and 50°, while the right plot shows pressure ratios against the same variable for those same beta settings. Both curves demonstrate a general trend of increasing performance at lower relative flow rates that gradually declines toward higher flow rates, with each beta angle curve exhibiting distinct positions indicating differences in operational behavior. The data suggests that variations in beta angle influence both efficiency and pressure ratio profiles within the operating range.\"/\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"110 580 913 666\" data-label=\"Caption\"\u003e\n\u003cp\u003e\u003ci\u003eFigure 1: The graph presents two plots showing performance characteristics of a centrifugal compressor\u003c/i\u003e \u003ci\u003erotor under different beta angles, illustrating how efficiency and pressure ratio vary with relative flow rate\u003c/i\u003e \u003ci\u003eacross three specified beta conditions. The left plot displays efficiency percentages against relative flow rate\u003c/i\u003e \u003ci\u003efor beta angles of 40°, 45°, and 50°, while the right plot shows pressure ratios against the same variable for\u003c/i\u003e \u003ci\u003ethose same beta settings. Both curves demonstrate a general trend of increasing performance at lower\u003c/i\u003e \u003ci\u003erelative flow rates that gradually declines toward higher flow rates, with each beta angle curve exhibiting\u003c/i\u003e \u003ci\u003edistinct positions indicating differences in operational behavior. The data suggests that variations in beta\u003c/i\u003e \u003ci\u003eangle influence both efficiency and pressure ratio profiles within the operating range.\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"119 667 915 747\" data-label=\"Text\"\u003e\n\u003cp\u003eශ්‍රී ලංකාව බොහෝ පැරණි ශිෂ්ටාචාරයක්‌ ඇති රටකි. මීට වසර 2500 කට පමණ පෙර විජය නැමැති ඉන්දියානු රජ කුමාරයා සමග පැමිණි පිරිස ලංකාට පැමිණෙන විට කුවේණිය නම් යක්‍ෂ ගෝත්‍රික කාන්තාව කපු වියමින් සිටි බව මහවංශයේ සඳහන් වේ. එයින් පිලිබිඹු වන්නේ අතීතයේ සිටම අපේ රටේ රෙදි විවීම වැනි කර්මාන්ත කරවූ දියුණු ශිෂ්ට සම්පන්න ජන කොටසක්‌ වූ බවයි.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"114 744 923 827\" data-label=\"Text\"\u003e\n\u003cp\u003eසිදුකර ඇති පුරාවිද්‍යා පර්යේෂණ අනුව ලංකාවේ මානව යටගියාව පිළිබඳ සාධක අදින් වසර 125,000 දක්වා ඈතට දිවයයි. ලංකා‍වේ වයඹදිග හා ගිණිකොණදිග ප්‍රදේශයන්ගේ වෙරළාශ්‍රීත ප්‍රදේශවල ව්‍යාප්තව ඇති ඉරණමඩු පාංශු සංකීර්ණයට අයත් බූන්දල වැල්ලෙගංගොඩ හා පතිරාජවෙල යන ස්ථානයන්ගේ සිදුකරන ලද පුරාවිද්‍යා පර්යේෂණ අනුව මෙම කරුණු තහවුරු වී ඇත. මෙම න්‍යාය තවදුරටත් තහවුරු කිරීම සඳහා අමතර පර්යේෂණ අවශ්‍ය වේ.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"108 840 319 856\" data-label=\"Page-Footer\"\u003e\n\u003cp\u003egraph presents plots showing\u003c/p\u003e\n\u003c/div\u003e", "image_rel": "images/syn_illustrated_report_si_000005_p01.aug00.jpg", "local": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "global": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "full": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}}, {"name": "syn_magazine_fr_000011_p01.aug00.jpg", "reference": "\u003cdiv data-bbox=\"53 42 296 55\" data-label=\"Page-Header\"\u003e\n\u003cp\u003eTHE ATLAS · The Interview · Juin 2024\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"51 64 444 225\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003eActualités Internationales : Un Regard Critique\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"55 232 187 245\" data-label=\"Text\"\u003e\n\u003cp\u003e\u003cb\u003ePar Philippe Chrétien\u003c/b\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"53 249 486 458\" data-label=\"Text\"\u003e\n\u003cp\u003eLe secteur agricole contribue au PIB à hauteur de 18 % et représente 61 % du total des exportations. L'Argentine compte environ de paysans, qui produisent près de 80 % des légumes consommés dans le pays. Pourtant, « la culture prédominante des grands propriétaires fonciers rend invisibles les petits producteurs », déplore Matías Bohl, référent de la Fédération nationale paysanne. La propriété de la terre est très inégalement répartie. Moins de 1 % des propriétaires terriens possèdent 40 % de la terre. Le gouvernement annonce des mesures pour la biodiversité. Manifestation massive pour la protection de l'environnement.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"57 461 487 650\" data-label=\"Text\"\u003e\n\u003cp\u003eLa moitié des communes a moins de deux cents habitants, dix-sept communes en ont moins de cinquante, et de nombreux hameaux ont été abandonnés. Les villes sont petites : seules sont considérées comme urbaines par l'INSEE et seules deux agglomérations, celles de Digne-les-Bains et Manosque, dépassent les . Les arrondissements de Barcelonnette et de Castellane sont les deux arrondissements les moins peuplés de France. Celui de Barcelonette est le seul de France avec moins de . La ville de Castellane est également la plus petite sous-préfecture de France.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"58 654 380 757\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003eLe Rôle De La Culture Dans La Société\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"61 763 237 779\" data-label=\"Text\"\u003e\n\u003cp\u003e\u003cb\u003ePar Bernadette-Suzanne Bazin\u003c/b\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"511 60 946 269\" data-label=\"Text\"\u003e\n\u003cp\u003eDans les années 1920, bien qu'il ait accepté de devenir un romancier d'aventures, Maurice Leblanc cherche toujours à s'émanciper de son héros à succès. Cependant, les romans publiés avec un nouveau héros rencontrent un succès moindre, si bien que l'écrivain transforme à l'occasion certains de ses récits en aventures inédites d'Arsène Lupin. Ainsi, en 1923, il consent à introduire de façon anecdotique, le gentleman cambrioleur lors de la réédition de L'Éclat d'obus ; dans les années 1927-1928, Leblanc se résout à transformer, en cours d'écriture, le détective Jim Barnett en avatar de Lupin. Nouvelles technologies pour une énergie plus verte.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"513 276 943 466\" data-label=\"Text\"\u003e\n\u003cp\u003eLes présidences se succèdent entre 1930 et 1983, mais sur seize présidents, onze sont des militaires et plusieurs sont « présidents de facto » (par opposition aux présidents élus). Perón fait alors ses débuts dans la politique : lieutenant-colonel titulaire de quelques secrétariats d'État du gouvernement militaire établi en juin 1943, il est élu président après la fin de la Seconde Guerre mondiale. Celle-ci ayant entraîné l’affaiblissement de l’Occident, l'Argentine devient, vers 1950, la neuvième puissance économique mondiale. Après la guerre, de nombreux nazis fuient en Argentine et ailleurs en Amérique latine.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"512 469 929 533\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003eVoyage : Découvrir La France Rurale\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"513 539 621 548\" data-label=\"Text\"\u003e\n\u003cp\u003e\u003cb\u003ePar Astrid Vincent\u003c/b\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"511 557 939 712\" data-label=\"Text\"\u003e\n\u003cp\u003eLa partie côtière du littoral Azuréen, est très urbanisée et densément peuplée, elle regroupe toutes les villes de la Côte d'Azur dans une conurbation quasi continue de Menton à Théhoule-sur-Mer, tandis que la partie montagneuse, plus étendue mais faiblement peuplée, est entièrement rurale exception faite des trois grandes stations de Valberg née en 1936, Auron en 1937 et Isola 2000 en 1971. Nouvelles technologies pour une énergie plus verte.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"513 715 937 888\" data-label=\"Text\"\u003e\n\u003cp\u003eSelon une importante étude du Barometer d'Amérique latine, le paysage religieux argentin se répartit entre 77 % de catholiques, 7 % de protestants, 4 % des autres religions et 13 % de sans religion. Le nombre d'athées est très important pour un pays d'Amérique latine, d'autant plus que dans les années 1960, il n'y avait que rarement d'Argentins sans religion. Nouvelles technologies pour une énergie plus verte. Le réchauffement climatique affecte les cultures agricoles. L'ONU appelle à des actions urgentes pour le climat.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"62 900 262 919\" data-label=\"Page-Footer\"\u003e\n\u003cp\u003eTHE ATLAS · numéro 196 · Juin 2024\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"490 914 509 923\" data-label=\"Page-Footer\"\u003e\n\u003cp\u003e\u003cb\u003e319\u003c/b\u003e\u003c/p\u003e\n\u003c/div\u003e", "image_rel": "images/syn_magazine_fr_000011_p01.aug00.jpg", "local": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "global": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "full": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}}, {"name": "syn_multi_column_he_000001_p01.aug00.jpg", "reference": "\u003cdiv data-bbox=\"588 44 933 60\" data-label=\"Page-Header\"\u003e\n\u003cp\u003eקאסם, מחאג'נה and גרבאן · Upgradable user-facing policy · 33\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"507 81 933 144\" data-label=\"Text\"\u003e\n\u003cp\u003eגופים שמימיים מסיביים יותר, כמו גלקסיות, צבירי גלקסיות, או קוואזרים, יכולים לגרום לגופים שנמצאים מאחוריהם להראות כמה פעמים, או להראות כטבעות המקיפות את הגוף. איינשטיין חזה תופעה זו, אולם היא התגלתה רק בשנות ה-70 של המאה ה-20. \u003csup\u003e1\u003c/sup\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"505 141 934 229\" data-label=\"Text\"\u003e\n\u003cp\u003eצריבת תקליטורים מכיוון שצורבי תקליטורים מיועדים לשוק הביתי, יצירתם נעשית באופן שונה מתקליטורים רגילים. במקום שקערוריות תקליטורים אלה מורכבים מחומרים הרגישים לחום, וקרן הליזר של צורב התקליטורים צובעת את החומר בעזרת לייזר. כאשר אזור מסוים צבוע, הוא אינו מחזיר את האור מקרן הלייזר ואז נוצר אפקט זהה. בתקליטורים הניתנים לצריבה רב-פעמית, התהליך הפיך ובטמפרטורה מסוימת החומר הופך שקוף.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"505 228 934 286\" data-label=\"Text\"\u003e\n\u003cp\u003eהמשימה עוזרת לסלול את הדרך למסעות אנושיים עתידיים למאדים ומדגימה טכנולוגיות שניתן להשתמש בהן. אלה כוללים בדיקת שיטה להפקת חמצן מאטמוספירת המאדים, זיהוי משאבים אחרים (כגון מים תת-קרקעיים), שיפור טכניקות נחיתה,\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"63 89 480 134\" data-label=\"Text\"\u003e\n\u003cp\u003eואפיון מזג האוויר, האבק ותנאים סביבתיים פוטנציאליים אחרים העלולים להשפיע על אסטרונאוטים עתידיים החיים ועובדים על מאדים. הניתוח הנוכחי מעיד על הפרקטיקה הקלינית.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"76 133 468 175\" data-label=\"Text\"\u003e\n\u003cp\u003e\u003ci\u003e“עם ההתקרבות לשמש מתנדף הקרח ונוצרת הילה\u003c/i\u003e \u003ci\u003eשל גזים שהשתחררו מהגרעין.”\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"61 174 480 232\" data-label=\"Text\"\u003e\n\u003cp\u003eבעיה נוספת מעבר להנדסה הפוכה היא כאשר נדרשת תאימות לפרוטוקול או סוג קובץ שמחויב על ידי ניהול זכויות דיגיטלי או מחשוב אמין, מוגבל על ידי פטנטים או מוגבל על ידי החוק. במחקר זה, המחקר הקוהורטי חוקר את הקשר בין עומס הסימפטומים לסיכון גנטי.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"61 230 480 316\" data-label=\"Text\"\u003e\n\u003cp\u003eניוטון נפטר בשנתו בלונדון ב-20 במרץ 1727, ונקבר במנזר ווסטמינסטר. וולטר היה ככל הנראה נוכח בהלווייתו. אחרי מותו, שיערו של ניוטון נבחן ונמצא כי הוא מכיל כספית, שנבעה ככל הנראה מחקירותיו האלכימיות. הרעלת כספית יכלה להסביר את האקסצנטריות של ניוטון מאוחר בחייו. במיוחד, ההשפעה הייתה צנועה באוכלוסיות קליניות למרות שביל הגורמי לתיקוי הטיפול עדיין לא חד משמע.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"63 316 480 384\" data-label=\"Text\"\u003e\n\u003cp\u003eהגרסה הנוכחית KDE Plasma 5 כוללת את סביבות העבודה הבאות: Plasma Desktop לכל מחשב המופעל באמצעות עכבר או מקלדת כגון מחשבים שולחניים או מחשבים ניידים. Plasma Mobile לטלפונים חכמים ולהתקנים בעלי מסך מגע. Plasma Media Center לטלוויזיות חכמות ולסטרימרים.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"63 389 479 442\" data-label=\"Text\"\u003e\n\u003cp\u003eהתחומים המרכזיים במתמטיקה נוצרו מתוך הצורך בהבנת הקשר בין המספרים, במדידת שטחים, בחישובים לצורכי מס ומסחר, ובחיזוי אירועים שמימיים. מכאן נבעה החלוקה הבסיסית של המתמטיקה למחקר של כמות, מבנה, שינוי ומרחב.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"63 443 478 485\" data-label=\"Text\"\u003e\n\u003cp\u003eצפיפותו הממוצעת של מאדים 3.95 גרם לסמק. למאדים רק רבע מפני השטח של כדור הארץ ומסתו היא רק עשירית ממסתו של כדור הארץ. כוח המשיכה על פני מאדים הוא כ־38% מכוח המשיכה על פני כדור הארץ.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"873 509 936 520\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003eתוצאות\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"58 544 936 602\" data-label=\"Text\"\u003e\n\u003cp\u003eהמשימה עוזרת לסלול את הדרך למסעות אנושיים עתידיים למאדים ומדגימה טכנולוגיות שניתן להשתמש בהן. אלה כוללים בדיקת שיטה להפקת חמצן מאטמוספירת המאדים, זיהוי משאבים אחרים (כגון מים תת-קרקעיים), שיפור טכניקות נחיתה, ואפיון מזג האוויר, האבק ותנאים סביבתיים פוטנציאליים אחרים העלולים להשפיע על אסטרונאוטים עתידיים החיים ועובדים על מאדים. האנליזה גילתה קירולציה חלשה בין חומרת בסיס לתמיכה חברתית, אבל הממצאים שלנו מוסיפים עבודה קודמת על מינון התרופות.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"59 601 935 622\" data-label=\"Text\"\u003e\n\u003cp\u003e\u003ci\u003e“במיוחד, ההשפעה הייתה צנועה באוכלוסיות קליניות למרות שביל הגורמי לתיקוי הטיפול עדיין לא חד משמע.”\u003c/i\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"59 622 937 653\" data-label=\"Text\"\u003e\n\u003cp\u003eבצילומים שהגיעו נמצאו עדויות להתפרצויות וולקניות, שיטפונות אדירים ופני שטח מצולקים מפגיעות מטאוריטים אולם התגלית החדשה החשובה היא גילוי שכבות משקע המעידות על מחזוריות אקלימית על הכוכב הנובעת מהטיית ציר הכוכב. חומרת בסיס קורלציה משמעותית עם רמות סימנים ביולוגיים.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"59 650 937 682\" data-label=\"Text\"\u003e\n\u003cp\u003eהיסטוריה חברת AMD הוקמה בשנת 1969 על ידי ג'רי סאנדרס. במשך שנים רבות ייצרה מעבדים תואמי אינטל ואף חתמה עמה ב-1982 על חוזה שהפך אותה ליצרן מורשה של אינטל למעבדי 8086 ו-8088. לשם כך, מצאנו אפקט תלוי במינון בהגדרות שונות.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"60 679 938 726\" data-label=\"Text\"\u003e\n\u003cp\u003eתיאור האפיק הפרסי האפיק הפרסי הוא חלק ממערכת רחבת היקף שמרכזה השקע הנפאלי באסיה, ושלוחתה המערבית היא האפיק הפרסי, הנמשך מאזור המפרץ הפרסי אל חלקו הצפון מזרחי של הים התיכון. ממיקום האפיק נגזר משטר רוחות מערבי קבוע באזורה של ישראל, המזרים אוויר קריר יחסית, שהתקרר במהלך מעברו מעל הים התיכון (טמפרטורת הים התיכון בקיץ עומדת על כ־25-30 מעלות).\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"59 721 937 756\" data-label=\"Text\"\u003e\n\u003cp\u003eגם במיתולוגיה היוונית יש לליקוי החמה תפקיד של מטה זעם. באודיסיאה (סיפור מסעו של גיבור מלחמת טרויה, אודיסאוס, לביתו וניצחונו על מחזריה של אשתו) רועה החזירים, היחיד ממשרתיו של אודיסאוס שנשאר נאמן לאדונו, מתנבא כי אודיסאוס ישוב בתחילת החודש:\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"60 750 938 784\" data-label=\"Text\"\u003e\n\u003cp\u003eKirigami Kirigami היא שלד תוכנה המאפשר למפתחים לכתוב יישומים שפועלים בצורה שווה על אנדרואיד, Plasma Mobile או כל שולחן עבודה אחר מבוסס לינוקס כגון Gnome, פלזמה או Xfce ללא כל התאמות קוד.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"654 841 938 855\" data-label=\"Footnote\"\u003e\n\u003cp\u003e1. הקשר שנצפה נותר לאחר התאמה ללחץ שדיווח על עצמו.\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"429 906 556 915\" data-label=\"Page-Footer\"\u003e\n\u003cp\u003eקאסם, מחאג'נה and גרבאן\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"485 936 500 943\" data-label=\"Page-Footer\"\u003e\n\u003cp\u003e33\u003c/p\u003e\n\u003c/div\u003e", "image_rel": "images/syn_multi_column_he_000001_p01.aug00.jpg", "local": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "global": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "full": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}}, {"name": "syn_receipt_si_000006_p01.aug00.jpg", "reference": "\u003cdiv data-bbox=\"334 23 677 u003eプロデュース\u003c/td\u003e\u003ctd\u003eニック・ヴェネット\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e専門評論家によるレビュー\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e• Allmusic link\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eチャート最高順位\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e• 32位（アメリカ[1]）\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eザ・ビーチ・ボーイズ アルバム 年表\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eサーフィン・サファリ (1962年)サーフィン・U.S.A.(1963年)\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003eサーフィン・サファリ (1962年)\u003c/td\u003e\u003ctd\u003eサーフィン・U.S.A.(1963年)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eテンプレートを表示\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"257 14 590 62\" data-label=\"Text\"\u003e\n\u003cp\u003e\u003cb\u003eサ\u003c/b\u003e\u003cb\u003eー\u003c/b\u003e\u003cb\u003eフ\u003c/b\u003e\u003cb\u003eィ\u003c/b\u003e\u003cb\u003eン\u003c/b\u003e\u003cb\u003e・\u003c/b\u003e\u003cb\u003eサ\u003c/b\u003e\u003cb\u003eフ\u003c/b\u003e\u003cb\u003eァ\u003c/b\u003e\u003cb\u003eリ\u003c/b\u003e(\u003cb\u003e\u003ci\u003eSurfin'\u003c/i\u003e\u003c/b\u003e \u003cb\u003e\u003ci\u003eSafari\u003c/i\u003e\u003c/b\u003e)は、1962年にリリースされたザ・ビーチ・ボーイズのデビューアルバム。本作発表当時はザ・ビーチ・ボーイズが後にアメリカを代表するバンドに成長することを示唆するものはほとんど見られなかった。\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"254 65 591 167\" data-label=\"Text\"\u003e\n\u003cp\u003e1961年の秋にブライアン・ウィルソンとそのいとこのマイク・ラブは「サーフィン」を作曲した。ブライアンは弟のデニスとカール、高校の友人アル・ジャーディンを引き入れバンドを結成した。ブライアンはドラムを担当し、カールがリードギター、アルがベース、マイクはフロント・ヴォーカルを担当した。後にアルは学業に専念するため一時脱退、本作のレコーディングでは代役のデヴィッド・マークスがサイドギターで全面的に参加している。デヴィッドはベースが弾けなかったため、ブライアンがベースに転向し、デニスがドラムスを演奏することとなった。\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"252 174 591 287\" data-label=\"Text\"\u003e\n\u003cp\u003eアナログ盤はモノ・ミックス及び、これを擬似ステレオ化したデュオフォニック・ミックスで発売された。CDではモノ・ミックスのみが発売されている。曲によってはセッション・テープが発見されていない、もしくは現存していないため、ボーナス・トラックの「ランド・アホイ」(「サーフィン」収録のためにトラック・リストから落とされた曲)を除きトゥルー・ステレオ化が実現していない。2012年『サーフィン・U.S.A.』から『スマイリー・スマイル』までがモノ&amp;ステレオの2in1で再発された際、『サーフィン・サファリ』もステレオ・ヴァージョンを発表する計画があり実際に制作も進められていたが[2]、ステレオ化は技術的に無理と判断され実現の可能性は低い[3]。\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"251 306 278 320\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003e曲目\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"270 328 766 768\" data-label=\"List-Group\"\u003e\n\u003col style=\"list-style-type: none;\"\u003e\n\u003cli\u003e1. サ ー フ ィ ン ・ サ フ ァ リ - Surfin' Safari (Brian Wilson/Mike Love)\u003c/li\u003e\n\u003cli\u003e演 奏 時 間 ： 2'05\" 、 リ ー ド ・ ヴ ォ ー カ ル ： マ イ ク ・ ラ ブ\u003c/li\u003e\n\u003cli\u003e2. カ ウ ン テ ィ ・ フ ェ ア ー - County Fair (Brian Wilson/Gary Usher)\u003c/li\u003e\n\u003cli\u003e演 奏 時 間 ： 2'15\" 、 リ ー ド ・ ヴ ォ ー カ ル ： マ イ ク ・ ラ ブ\u003c/li\u003e\n\u003cli\u003e3. テ ン ・ リ ト ル ・ イ ン デ ィ ア ン ズ - Ten Little Indians (Brian Wilson/Gary Usher)\u003c/li\u003e\n\u003cli\u003e演 奏 時 間 ： 1'26\" 、 リ ー ド ・ ヴ ォ ー カ ル ： マ イ ク ・ ラ ブ\u003c/li\u003e\n\u003cli\u003e4. チ ャ ガ ・ ラ ガ - Chug-A-Lug (Brian Wilson/Gary Usher/Mike Love)\u003c/li\u003e\n\u003cli\u003e演 奏 時 間 ： 1'59\" 、 リ ー ド ・ ヴ ォ ー カ ル ： マ イ ク ・ ラ ブ\u003c/li\u003e\n\u003cli\u003e5. リ ト ル ・ ガ ー ル - Little Girl (You're My Miss America) (Catalano/Herb Alpert)\u003c/li\u003e\n\u003cli\u003e演 奏 時 間 ： 2'04\" 、 リ ー ド ・ ヴ ォ ー カ ル ： デ ニ ス ・ ウ ィ ル ソ ン\u003c/li\u003e\n\u003cli\u003e6. 409 - 409 (Brian Wilson/Mike Love/Gary Usher)\u003c/li\u003e\n\u003cli\u003e演 奏 時 間 ： 1'59\" 、 リ ー ド ・ ヴ ォ ー カ ル ： マ イ ク ・ ラ ブ\u003c/li\u003e\n\u003cli\u003e7. サ ー フ ィ ン - Surfin' (Brian Wilson/Mike Love)\u003c/li\u003e\n\u003cli\u003e演 奏 時 間 ： 2'10\" 、 リ ー ド ・ ヴ ォ ー カ ル ： マ イ ク ・ ラ ブ\u003c/li\u003e\n\u003cli\u003eシ ン グ ル B 面 の 「 ル ア ウ Luau 」 は 公 式 ア ル バ ム に は 収 録 さ れ な か っ た 。 1991 年 の ア ル バ ム 『 ロ ス ト ・ ア ン ド 003e\n\u003cdiv data-bbox=\"0 165 659 279\" data-label=\"Text\"\u003e\n\u003cp\u003eアナログ盤はモノ・ミックス及び、これを擬似ステレオ化したデュオフォニック・ミックスで発売された。CDではモノ・ミックスのみが発売されている。曲によってはセッション・テープが発見されていない、もしくは現存していないため、ボーナス・トラックの「ランド・アホイ」(「サーフィン」収録のためにトラック・リストから落とされた曲)を除きトゥルー・ステレオ化が実現していない。2012年『サーフィン・U.S.A.』から『スマイリー・スマイル』までがモノ&amp;ステレオの2in1で再発された際、『サーフィン・サファリ』もステレオ・ヴァージョンを発表する計画があり実際に制作も進められていたが[2]、ステレオ化は技術的に無理と判断され実現の可能性は低い[3]。\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"0 299 52 313\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003e曲目\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"53 325 994 775\" data-label=\"List-Group\"\u003e\n\u003col style=\"list-style-type: none;\"\u003e\n\u003cli\u003e1.サーフィン・サファリ -Surfin' Safari (Brian Wilson/Mike Love)\u003c/li\u003e\n\u003cli\u003e演奏時間：2'05\"、リード・ヴォーカル：マイク・ラブ\u003c/li\u003e\n\u003cli\u003e2.カウンティ・フェアー -County Fair (Brian Wilson/Gary Usher)\u003c/li\u003e\n\u003cli\u003e演奏時間：2'15\"、リード・ヴォーカル：マイク・ラブ\u003c/li\u003e\n\u003cli\u003e3.テン・リトル・インディアンズ -Ten Little Indians (Brian Wilson/Gary Usher)\u003c/li\u003e\n\u003cli\u003e演奏時間：1'26\"、リード・ヴォーカル：マイク・ラブ\u003c/li\u003e\n\u003cli\u003e4.チャガ・ラガ -Chug-A-Lug (Brian Wilson/Gary Usher/Mike Love)\u003c/li\u003e\n\u003cli\u003e演奏時間：1'59\"、リード・ヴォーカル：マイク・ラブ\u003c/li\u003e\n\u003cli\u003e5.リトル・ガール -Little Girl (You're My Miss America) (Catalano/Herb Alpert)\u003c/li\u003e\n\u003cli\u003e演奏時間：2'04\"、リード・ヴォーカル：デニス・ウィルソン\u003c/li\u003e\n\u003cli\u003e6. 409 - 409 (Brian Wilson/Mike Love/Gary Usher)\u003c/li\u003e\n\u003cli\u003e演奏時間：1'59\"、リード・ヴォーカル：マイク・ラブ\u003c/li\u003e\n\u003cli\u003e7.サーフィン -Surfin' (Brian Wilson/Mike Love)\u003c/li\u003e\n\u003cli\u003e演奏時間：2'10\"、リード・ヴォーカル：マイク・ラブ\u003c/li\u003e\n\u003cli\u003eシングルB面の「ルアウLuau」は公式アルバムには収録されなかった。1991年のアルバム『ロスト・アンド・ファウン\u003c/li\u003e\n\u003cli\u003eドLost And Found (1961-62)』に収録された。\u003c/li\u003e\n\u003cli\u003e8.君の勝ち -Heads You Win - Tails I Lose (Brian Wilson/Gary Usher)\u003c/li\u003e\n\u003cli\u003e演奏時間：2'17\"、リード・ヴォーカル：マイク・ラブ\u003c/li\u0 d\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e山号\u003c/td\u003e\u003ctd\u003e安楽山\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e院号\u003c/td\u003e\u003ctd\u003e菩提院\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e宗派\u003c/td\u003e\u003ctd\u003e浄土宗\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e本尊\u003c/td\u003e\u003ctd\u003e阿弥陀如来苅萱親子地蔵\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e創建年\u003c/td\u003e\u003ctd\u003e（伝）正治元年（1199年）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e開基\u003c/td\u003e\u003ctd\u003e苅萱上人（苅萱道心）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e正式名\u003c/td\u003e\u003ctd\u003e安楽山菩提院往生寺\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e別称\u003c/td\u003e\u003ctd\u003e苅萱堂\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e法人番号\u003c/td\u003e\u003ctd\u003e1100005000331\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eテンプレートを表示\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"763 947 805 965\" data-label=\"Section-Header\"\u003e\n\u003ch1\u003e往生寺\u003c/h1\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"736 967 828 990\" data-label=\"Caption\"\u003e\n\u003cp\u003e往生寺 (長野県)\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"96 14 708 95\" data-label=\"Text\"\u003e\n\u003cp\u003e\u003cb\u003e往\u003c/b\u003e\u003cb\u003e生\u003c/b\u003e\u003cb\u003e寺\u003c/b\u003e（おうじょうじ）は、長野県長野市にある浄土宗の寺院。山号は安楽山、院号は菩提院。善光寺の奥の院にあたる。本尊は阿弥陀如来。\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"94 86 141 112\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003e概要\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"79 124 700 247\" data-label=\"Text\"\u003e\n\u003cp\u003e市内の西光寺とともに、謡曲、説経節などで広まった苅萱と石堂丸の伝説で知られ、正治元年（1199年）創建の伝承を持つ。境内には善行寺如来が来迎して刈萱を招いたという来迎松と、刈萱の墓、苅萱親子地蔵がある。また地元出身の草川信が作曲した唱歌「夕焼小焼」のモデルとなった鐘と、その歌碑がある。\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"104 225 405 262\" data-label=\"Text\"\u003e\n\u003cp\u003e→「西光寺 (長野市) §歴史と「苅萱伝説」」も参照\u003c/p\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"73 259 213 293\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003e交通アクセス\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"93 299 360 334\" data-label=\"List-Group\"\u003e\n\u003cul\u003e\n\u003cli\u003eJR 北 陸 新 幹 線 長 野 駅 か ら 車 で 約 10 分 。\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"67 336 156 365\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003e参考文献\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"82 375 480 443\" data-label=\"List-Group\"\u003e\n\u003cul\u003e\n\u003cli\u003e『 信 州 の 文 化 シ リ ー ズ 寺 と 神 社 』 1981 年 信 濃 毎 日 新 聞 社\u003c/li\u003e\n\u003cli\u003e『 探 訪 信 州 の 古 寺 浄 土 教 ・ 日 蓮 宗 』 1996 年 郷 土 出 版 社\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"56 435 148 465\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003e関連項目\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"75 474 190 498\" data-label=\"List-Group\"\u003e\n\u003cul\u003e\n\u003cli\u003e西 光 寺 ( 長 野 市 )\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"45 509 163 541\" data-label=\"Section-Header\"\u003e\n\u003ch2\u003e外部リンク\u003c/h2\u003e\n\u003c/div\u003e\n\u003cdiv data-bbox=\"61 548 458 618\" data-label=\"List-Group\"\u003e\n\u003cul\u003e\n\u003cli\u003eな が の 百 景 38 ま ち な み が 望 め る 往 生 寺 長 野 市\u003c/li\u003e\n\u003cli\u003e刈 萱 堂 往 生 寺 （ お う じ ょ う じ ） ◎ 浄 土 宗 全 国 善 行 寺 会\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/div\u003e", "image_rel": "images/wikipedia-ja-bc9d62058c.aug00.jpg", "local": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "global": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}, "full": {"hypothesis": "(pending — train checkpoint ke baad compare_local_global.py chalega)", "cer": null, "wer": null, "exact_match": null}}]};

function fmt(v, d=3) {
  if (v === null || v === undefined) return "—";
  return Number(v).toFixed(d);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

function renderMetrics() {
  const m = DATA.metrics || {};
  const branches = ["local", "global", "full"];
  document.getElementById("sub").textContent =
    `${DATA.n_samples || 0} images · ${DATA.checkpoint || "no checkpoint yet"}`;
  const st = document.getElementById("status");
  if (DATA.status === "waiting_for_checkpoint" || DATA.note) {
    st.style.display = "block";
    st.textContent = DATA.note || "Waiting for train checkpoint + compare…";
  }
  document.getElementById("metrics").innerHTML = branches.map(b => {
    const x = m[b] || {};
    return `<div class="metric-card"><h2>${b}</h2>
      <div class="nums">CER ${fmt(x.cer, 4)} · WER ${fmt(x.wer, 4)} · EM ${fmt(x.exact_match, 4)}</div>
    </div>`;
  }).join("");
}

function renderRail(active) {
  const rail = document.getElementById("rail");
  rail.innerHTML = (DATA.samples || []).map((s, i) => {
    const cls = i === active ? "thumb-btn active" : "thumb-btn";
    const img = s.image_rel ? `<img src="${esc(s.image_rel)}" alt=""/>` : "";
    return `<button type="button" class="${cls}" data-i="${i}">
      ${img}
      <div><div class="name">${esc(s.name)}</div>
      <div class="meta">L ${fmt(s.local?.cer)} · G ${fmt(s.global?.cer)}</div></div>
    </button>`;
  }).join("");
  rail.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => show(Number(btn.dataset.i)));
  });
}

function col(title, body, score, gt) {
  return `<div class="col${gt ? " gt" : ""}">
    <h4>${esc(title)}</h4>
    ${score ? `<div class="score">${esc(score)}</div>` : ""}
    <pre>${esc(body)}</pre>
  </div>`;
}

function show(i) {
  const s = DATA.samples[i];
  if (!s) return;
  renderRail(i);
  const L = s.local || {}, G = s.global || {}, F = s.full || {};
  document.getElementById("detail").innerHTML = `
    <h3>${esc(s.name)}</h3>
    ${s.image_rel ? `<img class="hero" src="${esc(s.image_rel)}" alt=""/>` : ""}
    <div class="cols">
      ${col("Local prediction", L.hypothesis,
        `CER=${fmt(L.cer)} WER=${fmt(L.wer)} EM=${fmt(L.exact_match, 0)}`)}
      ${col("Global prediction", G.hypothesis,
        `CER=${fmt(G.cer)} WER=${fmt(G.wer)} EM=${fmt(G.exact_match, 0)}`)}
      ${col("Ground truth", s.reference || "", null, true)}
    </div>
    <div class="cols" style="margin-top:.75rem; grid-template-columns:1fr">
      ${col("Full (local+global) prediction", F.hypothesis,
        `CER=${fmt(F.cer)} WER=${fmt(F.wer)} EM=${fmt(F.exact_match, 0)}`)}
    </div>`;
}

renderMetrics();
show(0);
</script>
</body>
</html>
