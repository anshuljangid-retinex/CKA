# Fast TokenProjector run (stuck full-1k killed). Matches MLP silu 128x1 prompted scale.
# Train split capped; eval on val (21). BLEURT on at eval.
dataset: synthdocs
data_root: "C:/Users/FITT/Desktop/MLP/Retinex-AIGCsynthdocs-warp-slice-1k"
split: train
max_samples: 128
max_target_length: 256
batch_size: 1
num_workers: 0

epochs: 1
lr: 1.0e-4
weight_decay: 0.01
grad_clip: 1.0
log_every: 5
seed: 42

teleocr_id: "StarDoc-AI/TeleOCR"
chandra_id: "datalab-to/chandra-ocr-2"
checkpoint_dir: "checkpoints/token_projector_128x1_fast"

device: cuda
dtype: bfloat16
use_stub: false

max_vision_tokens: 256
prompt: ocr_layout

eval_split: val
bleurt: true

aligner:
  hidden_dim: 2048
  dropout: 0.0
  activation: silu
