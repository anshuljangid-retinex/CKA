# Full synthdocs train split (~979) x 2 epochs; shorter seqs to avoid VRAM thrash hang.
# Eval: val (21) + BLEURT.
dataset: synthdocs
data_root: "C:/Users/FITT/Desktop/MLP/Retinex-AIGCsynthdocs-warp-slice-1k"
split: train
max_samples: null
max_target_length: 256
batch_size: 1
num_workers: 0

epochs: 2
lr: 1.0e-4
weight_decay: 0.01
grad_clip: 1.0
log_every: 10
seed: 42

teleocr_id: "StarDoc-AI/TeleOCR"
chandra_id: "datalab-to/chandra-ocr-2"
checkpoint_dir: "checkpoints/token_projector_full1k_silu_2ep_tok256"

device: cuda
dtype: bfloat16
use_stub: false

max_vision_tokens: 256
prompt: ocr_layout

eval_split: val
bleurt: true

aligner:
  hidden_dim: 2048
  dropout: 0.0
  activation: silu
